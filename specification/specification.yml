        - type
        - price
        - previewImage
        - cityName
        - cityLatitude
        - cityLongitude
        - cityZoom
        - offerLatitude
        - offerLongitude
        - offerZoom
        - description
        - bedrooms
        - offerGoods
        - images
        - maxAdults
