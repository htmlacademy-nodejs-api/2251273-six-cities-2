openapi: 3.0.3

info:
  title: Real Estate Rental API
  description: |
    REST API для сервиса аренды недвижимости «Шесть городов».

    Спецификация построена на основе сущностей:
    - User;
    - Offer;
    - Comment.

    Основные ресурсы:
    - пользователи;
    - предложения;
    - комментарии;
    - аутентификация.

    В качестве публичных идентификаторов ресурсов используются строковые id,
    сгенерированные на сервере (UUID). Внутренний MongoDB _id наружу не отдаётся.

    Поле isFavorite в ответах Offer — вычисляется на сервере для текущего
    пользователя (если он авторизован) и не хранится в базе.
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: Users
    description: Операции с пользователями
  - name: Offers
    description: Операции с предложениями
  - name: Comments
    description: Операции с комментариями
  - name: Auth
    description: Аутентификация

paths:
  /users:
    post:
      tags:
        - Users
      summary: Создание пользователя
      description: |
        Создаёт нового пользователя.
        Используется как регистрация.

        Поля id, createdAt и updatedAt генерируются сервером автоматически.
        Поле type не передаётся клиентом и устанавливается сервером.
        Если avatarUrl не передан — сервер подставит аватар по умолчанию.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUser'
      responses:
        '201':
          description: Пользователь успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Ошибка валидации запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Пользователь с таким email уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{userId}:
    get:
      tags:
        - Users
      summary: Получение пользователя по ID
      description: Возвращает данные пользователя по публичному идентификатору.
      operationId: getUserById
      parameters:
        - name: userId
          in: path
          required: true
          description: Публичный идентификатор пользователя
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Пользователь успешно найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Невалидный формат ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/avatar:
    post:
      tags:
        - Users
      summary: Загрузка аватара пользователя
      description: |
        Загружает аватар текущего пользователя.
        Требует авторизации. Формат файла — .jpg или .png.
        Поле формы — avatar.
      operationId: uploadAvatar
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - avatar
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        '200':
          description: Аватар успешно загружен. Возвращает обновлённого пользователя.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Некорректный файл
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{userId}/offers:
    get:
      tags:
        - Offers
      summary: Получение предложений пользователя
      description: Возвращает список предложений, созданных конкретным пользователем.
      operationId: getUserOffers
      parameters:
        - name: userId
          in: path
          required: true
          description: Публичный идентификатор пользователя
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: Максимальное количество возвращаемых предложений
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 60
      responses:
        '200':
          description: Список предложений пользователя
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Offer'
        '400':
          description: Невалидный формат ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /offers:
    get:
      tags:
        - Offers
      summary: Получение списка предложений
      description: |
        Возвращает список предложений.
        Поддерживает фильтрацию по городу и ограничение количества результатов.

        Ресурс доступен анонимам и авторизованным клиентам.
        Для авторизованного клиента поле isFavorite рассчитывается по его
        списку избранного; для анонима всегда false.
      operationId: getOffers
      parameters:
        - name: city
          in: query
          required: false
          description: Название города
          schema:
            $ref: '#/components/schemas/CityName'
        - name: limit
          in: query
          required: false
          description: Максимальное количество возвращаемых предложений
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 60
      responses:
        '200':
          description: Список предложений
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Offer'

    post:
      tags:
        - Offers
      summary: Создание предложения
      description: |
        Создаёт новое предложение.
        Требует авторизации пользователя.

        Поля id, createdAt, updatedAt, rating и commentsCount генерируются
        сервером автоматически.
        Поле user не передаётся клиентом и определяется из токена авторизации.
      operationId: createOffer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOfferInput'
      responses:
        '201':
          description: Предложение успешно создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '400':
          description: Ошибка валидации запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /offers/{offerId}:
    get:
      tags:
        - Offers
      summary: Получение предложения по ID
      description: |
        Возвращает подробную информацию о предложении.
        Поле isFavorite рассчитывается для текущего пользователя.
        Доступно анонимам и авторизованным.
      operationId: getOfferById
      parameters:
        - name: offerId
          in: path
          required: true
          description: Публичный идентификатор предложения
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Предложение успешно найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '400':
          description: Невалидный формат ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Предложение не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      tags:
        - Offers
      summary: Редактирование предложения
      description: |
        Обновляет предложение по публичному идентификатору.
        Требует авторизации. Редактировать может только автор.

        Все поля опциональны, но если переданы — проходят валидацию
        как при создании. Поля id, createdAt, updatedAt, rating,
        commentsCount и user изменить нельзя.
      operationId: updateOffer
      security:
        - bearerAuth: []
      parameters:
        - name: offerId
          in: path
          required: true
          description: Публичный идентификатор предложения
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOfferInput'
      responses:
        '200':
          description: Предложение успешно обновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '400':
          description: Ошибка валидации запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Попытка отредактировать чужое предложение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Предложение не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Offers
      summary: Удаление предложения
      description: |
        Удаляет предложение по публичному идентификатору.
        Требует авторизации. Удалить может только автор.
      operationId: deleteOffer
      security:
        - bearerAuth: []
      parameters:
        - name: offerId
          in: path
          required: true
          description: Публичный идентификатор предложения
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Предложение успешно удалено
        '400':
          description: Невалидный формат ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Попытка удалить чужое предложение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Предложение не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /offers/{offerId}/comments:
    get:
      tags:
        - Comments
      summary: Получение комментариев предложения
      description: |
        Возвращает список комментариев, оставленных к предложению.
        Отсортированы по дате публикации (по убыванию).
        Максимум — 50 последних комментариев.
      operationId: getOfferComments
      parameters:
        - name: offerId
          in: path
          required: true
          description: Публичный идентификатор предложения
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: Максимальное количество возвращаемых комментариев
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
      responses:
        '200':
          description: Список комментариев предложения
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
        '400':
          description: Невалидный формат ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Предложение не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Comments
      summary: Создание комментария
      description: |
        Создаёт новый комментарий к предложению.
        Требует авторизации пользователя.

        Поля id, createdAt и updatedAt генерируются сервером автоматически.
        Поле user не передаётся клиентом и определяется из токена авторизации.
      operationId: createComment
      security:
        - bearerAuth: []
      parameters:
        - name: offerId
          in: path
          required: true
          description: Публичный идентификатор предложения
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentInput'
      responses:
        '201':
          description: Комментарий успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          description: Ошибка валидации запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Предложение не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /offers/{offerId}/comments/{commentId}:
    delete:
      tags:
        - Comments
      summary: Удаление комментария
      description: |
        Удаляет комментарий по публичному идентификатору.
        Требует авторизации. Удалить может только автор комментария.
      operationId: deleteComment
      security:
        - bearerAuth: []
      parameters:
        - name: offerId
          in: path
          required: true
          description: Публичный идентификатор предложения
          schema:
            type: string
            format: uuid
        - name: commentId
          in: path
          required: true
          description: Публичный идентификатор комментария
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Комментарий успешно удалён
        '400':
          description: Невалидный формат ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Пользователь не является автором комментария
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Комментарий не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags:
        - Auth
      summary: Вход в систему
      description: |
        Аутентифицирует пользователя по email и паролю.
        В случае успеха возвращает токен и данные пользователя.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешная аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Ошибка валидации запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Неверный email или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags:
        - Auth
      summary: Выход из системы
      description: |
        Завершает текущую сессию (отзывает токен).
        Доступно только авторизованным клиентам.
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Сессия завершена
        '401':
          description: Токен отсутствует, невалиден или уже отозван
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/check:
    get:
      tags:
        - Auth
      summary: Проверка состояния пользователя
      description: |
        Проверяет, авторизован ли текущий клиент, и возвращает
        данные пользователя без конфиденциальных полей.
      operationId: checkAuth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Клиент авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Клиент не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserType:
      type: string
      enum:
        - regular
        - pro

    OfferType:
      type: string
      enum:
        - apartment
        - house
        - room
        - hotel

    CityName:
      type: string
      enum:
        - Paris
        - Cologne
        - Brussels
        - Amsterdam
        - Hamburg
        - Dusseldorf

    OfferGood:
      type: string
      description: Допустимые удобства предложения
      enum:
        - Breakfast
        - Air conditioning
        - Laptop friendly workspace
        - Baby seat
        - Washer
        - Towels
        - Fridge

    User:
      type: object
      required:
        - id
        - name
        - email
        - avatarUrl
        - type
        - favorites
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Публичный идентификатор пользователя
          example: 3f7b9f2e-8d4c-4b1a-9c6e-2f8a7d6b5c4d
        name:
          type: string
          description: Имя пользователя
          minLength: 1
          maxLength: 15
          example: Ivan
        email:
          type: string
          format: email
          description: Email пользователя
          example: ivan@example.com
        avatarUrl:
          type: string
          description: |
            Ссылка на аватар пользователя.
            Если пользователь не загрузил аватар — путь к изображению по умолчанию.
          maxLength: 2048
          example: /upload/default-avatar.png
        type:
          $ref: '#/components/schemas/UserType'
        favorites:
          type: array
          description: Публичные идентификаторы предложений в избранном
          items:
            type: string
            format: uuid
          example:
            - 7c9e6679-7425-40de-944b-e07fc1f90ae7
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    CreateUser:
      type: object
      description: |
        Данные для создания пользователя.

        Поле type не передаётся клиентом и устанавливается сервером.
        Поле avatarUrl опционально — при отсутствии сервер подставит аватар по умолчанию.
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 15
          example: Ivan
        email:
          type: string
          format: email
          example: ivan@example.com
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 12
          example: pass1234
        avatarUrl:
          type: string
          description: Ссылка на аватар пользователя
          maxLength: 2048
          example: /upload/ivan.png

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: ivan@example.com
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 12
          example: pass1234

    AuthResponse:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
          description: JWT-токен доступа
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
        user:
          $ref: '#/components/schemas/User'

    Offer:
      type: object
      required:
        - id
        - title
        - type
        - price
        - previewImage
        - cityName
        - cityLatitude
        - cityLongitude
        - cityZoom
        - offerLatitude
        - offerLongitude
        - offerZoom
        - isFavorite
        - isPremium
        - rating
        - description
        - bedrooms
        - offerGoods
        - user
        - images
        - maxAdults
        - commentsCount
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        title:
          type: string
          minLength: 10
          maxLength: 100
          example: Beautiful apartment in Paris
        type:
          $ref: '#/components/schemas/OfferType'
        price:
          type: number
          minimum: 100
          maximum: 100000
          example: 1200
        previewImage:
          type: string
          maxLength: 2048
          example: /images/offer-preview.jpg
        cityName:
          $ref: '#/components/schemas/CityName'
        cityLatitude:
          type: number
          format: double
          example: 48.8566
        cityLongitude:
          type: number
          format: double
          example: 2.3522
        cityZoom:
          type: number
          example: 12
        offerLatitude:
          type: number
          format: double
          example: 48.8566
        offerLongitude:
          type: number
          format: double
          example: 2.3522
        offerZoom:
          type: number
          example: 16
        isFavorite:
          type: boolean
          readOnly: true
          description: |
            Признак принадлежности предложения к избранному
            текущего пользователя. Для анонимных клиентов — false.
          example: false
        isPremium:
          type: boolean
          example: true
