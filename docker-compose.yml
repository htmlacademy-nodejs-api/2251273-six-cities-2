services:
  db:
    image: mongo:6.0
    restart: always
    container_name: buy-and-sell_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
    ports:
      - ${DB_PORT:-27017}:27017
    volumes:
      - buy-and-sell_data:/data/db
    networks:
      - buy-and-sell-network
    healthcheck:
      test: >
        mongosh "mongodb://$$MONGO_INITDB_ROOT_USERNAME:$$MONGO_INITDB_ROOT_PASSWORD@localhost:27017/admin?authSource=admin"
        --quiet --eval "db.runCommand('ping').ok"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  db_ui:
    image: mongo-express:1.0.2-20
    restart: always
    container_name: buy-and-sell_mongo_express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_BASICAUTH_USERNAME: ${UI_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${UI_PASSWORD:-admin}
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${DB_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${DB_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://db:27017/
    depends_on:
      db:
        condition: service_healthy
    networks:
      - buy-and-sell-network

volumes:
  buy-and-sell_data:

networks:
  buy-and-sell-network:
    driver: bridge
